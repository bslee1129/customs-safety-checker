name: Streamlit Keep Alive

on:
  schedule:
    # 6시간마다 자동 실행 (UTC 기준 00:00, 06:00, 12:00, 18:00)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit and Wake Up Streamlit App
        run: |
          python - << 'EOF'
          from playwright.sync_api import sync_playwright

          URL = "https://customs-safety-checker.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
              )
              page = context.new_page()
              print(f"Visiting {URL}...")
              page.goto(URL, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(8000)

              # 절전 모드("Yes, get this app back up!") 버튼이 있는지 확인 후 클릭
              wake_btn = page.locator("button:has-text('Yes, get this app back up')")
              if wake_btn.count() > 0 and wake_btn.first.is_visible():
                  print("App is sleeping! Clicking wake-up button...")
                  wake_btn.first.click()
                  page.wait_for_timeout(20000)
                  print("Wake-up triggered successfully!")
              else:
                  print("App is already awake and running!")

              browser.close()
          EOF
